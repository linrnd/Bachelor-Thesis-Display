    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .sidebar {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sidebar a {
            color: #666;
            text-decoration: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .sidebar a:hover {
            color: #0078d6;
        }
        .sidebar a.active {
            color: #fff;
        }
        .container {
            max-width: 900px;
            width: 100%;
            padding-top: 10vh;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #0078d6;
        }
        .cover-image {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
        }
        @media (max-width: 767px) {
            .back-link {
                top: 12px;
                left: 12px;
                font-size: 15px;
            }
            .sidebar {
                position: fixed;
                left: 0;
                top: auto;
                bottom: 0;
                width: 100%;
                transform: none;
                flex-direction: row;
                gap: 0;
                overflow-x: auto;
                background: rgba(0, 0, 0, 0.92);
                padding: 12px 16px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                border-top: 1px solid #222;
            }
            .sidebar::-webkit-scrollbar { display: none; }
            .sidebar a {
                white-space: nowrap;
                font-size: 13px;
                letter-spacing: 1px;
                padding: 0 12px;
                flex-shrink: 0;
            }
            .container {
                padding-bottom: 70px;
            }
            body {
                padding-top: 55px;
                padding-left: 16px;
                padding-right: 16px;
            }
        }
