<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triquetra Pattern</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { background:#000; margin:0; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        svg { background:#000; }
        .curve { fill:none; stroke:#333; stroke-width:2; }
        .curve-glow { fill:none; stroke:white; stroke-width:3; filter:url(#glow); stroke-linecap:round; }
        .area-label { fill:#fff; font-family:'Bebas Neue', sans-serif; font-size:20px; text-anchor:middle; cursor:pointer; letter-spacing:3px; text-transform:uppercase; }
        .area-label:hover { fill:#0078d6; }
        .star { fill:#fff; }
    </style>
</head>
<body>
    <svg id="triquetra"></svg>

    <script>
        const svg = d3.select("#triquetra");
        const numStars = 50;
        const starData = Array.from({length: numStars}, () => ({
            xRatio: Math.random(), yRatio: Math.random(), size: Math.random()*1.5+0.5, opacity: Math.random()*0.6+0.4
        }));
        let animationId = null;

        function getControlPoint(start, end, bulgeAmount) {
            const midX = (start.x + end.x) / 2;
            const midY = (start.y + end.y) / 2;
            const dx = end.x - start.x, dy = end.y - start.y;
            const len = Math.hypot(dx, dy) || 1;
            const perpX = -dy / len, perpY = dx / len;
            return { x: midX + perpX * bulgeAmount, y: midY + perpY * bulgeAmount };
        }

        function createArc(start, end, bulgeAmount) {
            const ctrl = getControlPoint(start, end, bulgeAmount);
            return `M ${start.x} ${start.y} Q ${ctrl.x} ${ctrl.y} ${end.x} ${end.y}`;
        }

        function draw() {
            svg.selectAll("*").remove();
            const width = window.innerWidth, height = window.innerHeight;
            svg.attr("width", width).attr("height", height);
            const centerX = width/2, centerY = height/2;
            const patternSize = Math.min(width, height) * 0.85;
            const defs = svg.append("defs");

            // filters
            defs.append("filter").attr("id","starGlow").attr("x","-100%").attr("y","-100%").attr("width","300%").attr("height","300%")
                .append("feGaussianBlur").attr("stdDeviation","2");
            const textF = defs.append("filter").attr("id","textGlow").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
            textF.append("feGaussianBlur").attr("stdDeviation","3");
            const glow = defs.append("filter").attr("id","glow").attr("x","-50%").attr("y","-50%").attr("width","200%").attr("height","200%");
            glow.append("feGaussianBlur").attr("stdDeviation","6");

            // stars
            starData.forEach(s => {
                svg.append("circle").attr("class","star").attr("cx", Math.floor(width * s.xRatio)).attr("cy", Math.floor(height * s.yRatio))
                   .attr("r", s.size).attr("opacity", s.opacity).attr("filter","url(#starGlow)");
            });

            const radius = patternSize * 0.45;
            const points = {
                p1: { x: centerX, y: centerY - radius },
                p2: { x: centerX - radius * Math.cos(Math.PI / 6), y: centerY + radius * Math.sin(Math.PI / 6) },
                p3: { x: centerX + radius * Math.cos(Math.PI / 6), y: centerY + radius * Math.sin(Math.PI / 6) }
            };

            const curveRadius = radius * 1.9;
            const bulge = -curveRadius * 0.8;

            // base curves
            svg.append("path").attr("class","curve").attr("d", createArc(points.p1, points.p2, bulge));
            svg.append("path").attr("class","curve").attr("d", createArc(points.p2, points.p3, bulge));
            svg.append("path").attr("class","curve").attr("d", createArc(points.p3, points.p1, bulge));

            // labels (positioned near each arc)
            const labelPos = (a,b) => {
                const mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
                const ctrl = getControlPoint(a,b, bulge*0.45);
                return { x:(mid.x+ctrl.x)/2, y:(mid.y+ctrl.y)/2 };
            };
            const lp12 = labelPos(points.p1, points.p2);
            const lp23 = labelPos(points.p2, points.p3);
            const lp31 = labelPos(points.p3, points.p1);

            svg.append("a").attr("href","intro.html").append("text").attr("class","area-label").attr("x", lp12.x).attr("y", lp12.y).text("Intro");
            svg.append("a").attr("href","about.html").append("text").attr("class","area-label").attr("x", lp23.x).attr("y", lp23.y).text("About");
            svg.append("a").attr("href","threejs-cd-preview-main/index-white.html").append("text").attr("class","area-label").attr("x", lp31.x).attr("y", lp31.y).text("Preview");

            // LED path as a closed flowing curve around the three arcs
            const ctrl23 = getControlPoint(points.p2, points.p3, bulge);
            const ctrl31 = getControlPoint(points.p3, points.p1, bulge);
            const ctrl12 = getControlPoint(points.p1, points.p2, bulge);

            const ledPath = [
                `M ${points.p2.x} ${points.p2.y}`,
                `Q ${ctrl23.x} ${ctrl23.y} ${points.p3.x} ${points.p3.y}`,
                `Q ${ctrl31.x} ${ctrl31.y} ${points.p1.x} ${points.p1.y}`,
                `Q ${ctrl12.x} ${ctrl12.y} ${points.p2.x} ${points.p2.y}`
            ].join(" ");

            const glowPath = svg.append("path").attr("class","curve-glow").attr("d", ledPath);

            const pathNode = glowPath.node();
            const pathLength = pathNode.getTotalLength();
            const segmentLength = pathLength * 0.35;
            glowPath.attr("stroke-dasharray", `${segmentLength} ${pathLength}`).attr("stroke-dashoffset", 0);

            // animate LED
            if (animationId) cancelAnimationFrame(animationId);
            const duration = 6000;
            let start = performance.now();
            function animateLED(now) {
                const t = ((now || performance.now()) - start) % duration;
                const progress = t / duration;
                const offset = -progress * pathLength;
                glowPath.attr("stroke-dashoffset", offset);
                animationId = requestAnimationFrame(animateLED);
            }
            animationId = requestAnimationFrame(animateLED);
        }

        draw();
        window.addEventListener("resize", draw);
    </script>
</body>
</html>
